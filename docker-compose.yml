services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tracemind
      POSTGRES_USER: tracemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tracemind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemind -d tracemind"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  falkordb:
    image: falkordb/falkordb-server:latest
    environment:
      REDIS_ARGS: "--appendonly yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tracemind-falkordb:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  tracemind-postgres:
  tracemind-falkordb:
