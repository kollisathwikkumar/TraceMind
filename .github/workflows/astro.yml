# Validate the static docs site on every push. Publishing is opt-in because
# GitHub Pages may not be enabled for this repository/account.
name: Docs site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check landing page assets
        run: |
          test -s docs/launch.html
          test -s docs/launch.css
          test -s docs/launch.js

  deploy:
    name: Deploy to Pages
    if: vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage TraceMind landing page
        run: cp docs/launch.html docs/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
